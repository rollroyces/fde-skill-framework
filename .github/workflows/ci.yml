name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # No cache:pip — the framework is intentionally zero-dep, so
          # there is no requirements.txt or pyproject.toml to cache against.
          # (Earlier this defaulted to `cache: pip`, which made
          # actions/setup-python@v5 fail every run with "No file matched
          # requirements.txt or pyproject.toml".)
      - name: Install optional test deps (hypothesis for property tests)
        run: |
          python -m pip install --upgrade pip
          python -m pip install hypothesis || echo "hypothesis install failed — property tests will be skipped"
      - name: Run full test suite
        run: |
          python -m unittest discover -s tests -v
      - name: Run bundled-fixture smoke test
        run: |
          python tests/test_fde_eval.py > /tmp/smoke.log
          tail -5 /tmp/smoke.log
